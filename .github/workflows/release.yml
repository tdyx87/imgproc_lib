name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ============================================================
  # Build Release Artifacts
  # ============================================================
  build-release:
    strategy:
      matrix:
        include:
          - os: windows-latest
            preset: windows-msvc-shared
            name: windows-x64
          - os: ubuntu-latest
            preset: linux-gcc-shared
            name: linux-x64
          - os: macos-latest
            preset: macos-clang-shared
            name: macos-arm64
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Conan
      run: |
        pip install conan
        conan profile detect --force

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y ninja-build

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install ninja

    - name: Cache Conan packages
      uses: actions/cache@v4
      with:
        path: ~/.conan2
        key: ${{ runner.os }}-conan-${{ hashFiles('**/conanfile.txt') }}
        restore-keys: |
          ${{ runner.os }}-conan-

    - name: Install dependencies
      run: conan install . --output-folder=build --build=missing -s compiler.cppstd=17

    - name: Configure
      run: cmake --preset ${{ matrix.preset }}

    - name: Build
      run: cmake --build build --config Release --parallel

    - name: Package (Windows)
      if: runner.os == 'Windows'
      run: |
        mkdir -p package/imgproc_lib
        cp build/Release/imgproc_lib.dll package/imgproc_lib/
        cp build/Release/imgproc_lib.lib package/imgproc_lib/
        cp -r include package/imgproc_lib/
        cp README.md package/imgproc_lib/
        cd package && 7z a ../imgproc_lib-${{ matrix.name }}.zip imgproc_lib

    - name: Package (Unix)
      if: runner.os != 'Windows'
      run: |
        mkdir -p package/imgproc_lib
        cp build/libimgproc_lib* package/imgproc_lib/
        cp -r include package/imgproc_lib/
        cp README.md package/imgproc_lib/
        cd package && tar czvf ../imgproc_lib-${{ matrix.name }}.tar.gz imgproc_lib

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.name }}-release
        path: imgproc_lib-${{ matrix.name }}.*

  # ============================================================
  # Create Release
  # ============================================================
  create-release:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/**/*
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
