name: CI

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

env:
  BUILD_TYPE: Release
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  # ============================================================
  # Windows Build (MSVC)
  # ============================================================
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - preset: windows-msvc
            shared: "OFF"
          - preset: windows-msvc-shared
            shared: "ON"

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Conan
      run: |
        pip install conan
        conan profile detect --force

    - name: Cache Conan packages
      uses: actions/cache@v4
      with:
        path: ~/.conan2
        key: ${{ runner.os }}-conan-${{ hashFiles('**/conanfile.txt') }}
        restore-keys: |
          ${{ runner.os }}-conan-

    - name: Install dependencies
      run: conan install . --output-folder=build --build=missing -s compiler.cppstd=17

    - name: Remove Conan user preset (avoids conflict with project preset)
      run: Remove-Item -Force CMakeUserPresets.json, build/CMakePresets.json -ErrorAction SilentlyContinue

    - name: Configure
      run: cmake --preset ${{ matrix.preset }}

    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

    - name: Test
      run: ctest --preset windows-release --output-on-failure

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-x64-${{ matrix.shared == 'ON' && 'shared' || 'static' }}
        path: |
          build/${{ env.BUILD_TYPE }}/*.dll
          build/${{ env.BUILD_TYPE }}/*.lib
          build/${{ env.BUILD_TYPE }}/*.exe

  # ============================================================
  # Linux Build (GCC)
  # ============================================================
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shared: [OFF, ON]

    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Conan
      run: |
        pip install conan
        conan profile detect --force

    - name: Cache Conan packages
      uses: actions/cache@v4
      with:
        path: ~/.conan2
        key: ${{ runner.os }}-conan-${{ hashFiles('**/conanfile.txt') }}
        restore-keys: |
          ${{ runner.os }}-conan-

    - name: Install dependencies
      run: conan install . --output-folder=build --build=missing -s compiler.cppstd=17

    - name: Configure
      run: |
        cmake -S . -B build \
          -DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_CXX_STANDARD=17 \
          -DBUILD_SHARED_LIBS=${{ matrix.shared }} \
          -G Ninja

    - name: Build
      run: cmake --build build --parallel

    - name: Test
      run: ctest --test-dir build --output-on-failure

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-x64-${{ matrix.shared == 'ON' && 'shared' || 'static' }}
        path: |
          build/libimgproc_lib*

  # ============================================================
  # macOS Build (Clang)
  # ============================================================
  build-macos:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: brew install ninja

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Conan
      run: |
        pip install conan
        conan profile detect --force

    - name: Cache Conan packages
      uses: actions/cache@v4
      with:
        path: ~/.conan2
        key: ${{ runner.os }}-conan-${{ hashFiles('**/conanfile.txt') }}
        restore-keys: |
          ${{ runner.os }}-conan-

    - name: Install dependencies
      run: conan install . --output-folder=build --build=missing -s compiler.cppstd=17

    - name: Configure
      run: |
        cmake -S . -B build \
          -DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_CXX_STANDARD=17 \
          -G Ninja

    - name: Build
      run: cmake --build build --parallel

    - name: Test
      run: ctest --test-dir build --output-on-failure

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: macos-arm64-static
        path: |
          build/libimgproc_lib*

  # ============================================================
  # Code Quality (Static Analysis)
  # ============================================================
  code-quality:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-tidy cppcheck

    - name: Run cppcheck
      run: |
        cppcheck --enable=all --suppress=missingInclude \
          -I include \
          src/ 2>&1 | tee cppcheck-report.txt || true

    - name: Upload cppcheck report
      uses: actions/upload-artifact@v4
      with:
        name: cppcheck-report
        path: cppcheck-report.txt
